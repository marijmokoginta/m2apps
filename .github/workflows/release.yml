name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        target:
          - windows-amd64
          - linux-amd64
          - darwin-amd64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and package target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/windows dist/linux dist/macos

          case "${{ matrix.target }}" in
            windows-amd64)
              GOOS=windows GOARCH=amd64 go build -o dist/m2apps-windows-amd64.exe ./main.go
              cp dist/m2apps-windows-amd64.exe dist/windows/m2apps.exe
              cp install.ps1 dist/windows/install.ps1
              (cd dist/windows && zip -r ../m2apps-windows-amd64.zip m2apps.exe install.ps1)
              echo "ASSET_FILE=m2apps-windows-amd64.zip" >> "$GITHUB_ENV"
              ;;
            linux-amd64)
              GOOS=linux GOARCH=amd64 go build -o dist/m2apps-linux-amd64 ./main.go
              cp dist/m2apps-linux-amd64 dist/linux/m2apps
              chmod +x dist/linux/m2apps
              cp install.sh dist/linux/install.sh
              chmod +x dist/linux/install.sh
              (cd dist/linux && tar -czf ../m2apps-linux-amd64.tar.gz m2apps install.sh)
              echo "ASSET_FILE=m2apps-linux-amd64.tar.gz" >> "$GITHUB_ENV"
              ;;
            darwin-amd64)
              GOOS=darwin GOARCH=amd64 go build -o dist/m2apps-darwin-amd64 ./main.go
              cp dist/m2apps-darwin-amd64 dist/macos/m2apps
              chmod +x dist/macos/m2apps
              cp install.sh dist/macos/install.sh
              chmod +x dist/macos/install.sh
              (cd dist/macos && tar -czf ../m2apps-darwin-amd64.tar.gz m2apps install.sh)
              echo "ASSET_FILE=m2apps-darwin-amd64.tar.gz" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported target: ${{ matrix.target }}"
              exit 1
              ;;
          esac

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-asset
          path: dist/${{ env.ASSET_FILE }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Read changelog
        id: changelog
        shell: bash
        run: |
          FILE="changelog/${{ github.ref_name }}.md"
          if [ -f "$FILE" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "file=$FILE" >> "$GITHUB_OUTPUT"
          else
            echo "Changelog file not found, will use auto-generated release notes"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ steps.changelog.outputs.found }}" = "true" ]; then
            gh release create "$TAG" \
              --title "Release $TAG" \
              --notes-file "${{ steps.changelog.outputs.file }}"
          else
            gh release create "$TAG" \
              --title "Release $TAG" \
              --generate-notes
          fi

      - name: Upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/m2apps-windows-amd64.zip \
            dist/m2apps-linux-amd64.tar.gz \
            dist/m2apps-darwin-amd64.tar.gz
